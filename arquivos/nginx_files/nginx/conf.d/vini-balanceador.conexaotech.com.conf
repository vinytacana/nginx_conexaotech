upstream pool_apps{
    server node:3000;
    server node2:3000;

}




server{

      listen 80;
      listen [::]:80;

      server_name vini-balanceador.conexaotech.com;

      location / {

              return 301 https://$host$request_uri;
      }

}

server{

      listen 443 ssl;
      listen [::]:443 ssl;

      server_name vini-balanceador.conexaotech.com;

      ssl_certificate /etc/ssl/certs/server.crt;
      ssl_certificate_key /etc/ssl/certs/server.key;

      location / {
              proxy_pass http://pool_apps/;
              proxy_set_header X-Real-IP $remote_addr;

      }

}
